<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>物流地图</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f3ee; }
  #frame { width: 100%; height: 100%; border: 0; display: block; }
  #error { display: none; height: 100%; box-sizing: border-box; padding: 40px; color: #6e7b73; font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; text-align: center; }
  #error a { color: #1677ff; }
</style>
</head>
<body>
<iframe id="frame" referrerpolicy="no-referrer"></iframe>
<div id="error">地图页面暂时无法加载，请稍后重试。</div>
<script>
(function () {
  var frame = document.getElementById('frame')
  var error = document.getElementById('error')
  function fail() {
    frame.style.display = 'none'
    error.style.display = 'block'
  }
  var params = new URLSearchParams(window.location.search)
  var raw = params.get('u') || ''
  if (!raw) return fail()
  var decoded
  try { decoded = decodeURIComponent(raw) } catch (e) { return fail() }
  var url
  try { url = new URL(decoded) } catch (e) { return fail() }
  if (url.protocol !== 'https:' || url.hostname !== 'api.kuaidi100.com' || url.pathname.indexOf('/tools/map/') !== 0) return fail()
  frame.src = url.href
})()
</script>
</body>
</html>
